name: Android debug build

on:
  push:
    branches:
      - 'arena/d576f265-minecraft-client'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK components
        shell: bash
        run: |
          set +e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.0.12077973' 2>&1 | tee "$RUNNER_TEMP/sdk-setup.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(grep -Eim 5 'error|failed|exception' "$RUNNER_TEMP/sdk-setup.log" || tail -n 5 "$RUNNER_TEMP/sdk-setup.log")
            detail=${detail//'%'/'%25'}; detail=${detail//$'\n'/'%0A'}; detail=${detail//$'\r'/'%0D'}
            echo "::error title=Android SDK setup failed::$detail"
            exit "$status"
          fi
      - name: Run launch guardrails
        run: python3 -m unittest discover -s tests -v
      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail=$(grep -Eim 15 '(^e: |error:|^\* What went wrong:|^> |^FAILURE:)' "$RUNNER_TEMP/gradle-build.log" || tail -n 15 "$RUNNER_TEMP/gradle-build.log")
            detail=${detail//'%'/'%25'}; detail=${detail//$'\n'/'%0A'}; detail=${detail//$'\r'/'%0D'}
            echo "::error title=Android build failed::$detail"
            exit "$status"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: empyreal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
